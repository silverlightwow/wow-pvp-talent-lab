name: Audit PvP Aura semantics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_aura_descriptions.py"
      - ".github/workflows/aura-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Print current PvP Aura semantics
        run: python scripts/audit_aura_descriptions.py
