name: Audit PvP Aura semantics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_aura_descriptions.py"
      - ".github/workflows/aura-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Print current PvP Aura semantics
        run: python scripts/audit_aura_descriptions.py
