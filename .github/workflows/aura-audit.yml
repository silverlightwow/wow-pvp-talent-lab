name: Audit PvP Aura semantics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_aura_descriptions.py"
      - ".github/workflows/aura-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Print current PvP Aura semantics
        run: python scripts/audit_aura_descriptions.py
