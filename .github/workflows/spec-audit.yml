name: Cross-spec compatibility audit

on:
  workflow_dispatch:
    inputs:
      class_name:
        description: "Class to audit, or ALL"
        required: false
        default: "Priest"

permissions:
  contents: read

concurrency:
  group: spec-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: Audit class specs
        env:
          AUDIT_CLASS: ${{ github.event_name == 'workflow_dispatch' && inputs.class_name || 'Priest' }}
        run: |
          if [ "$AUDIT_CLASS" = "ALL" ]; then
            python scripts/audit_all_specs.py \
              --parallel-specs 1 \
              --concurrency 5 \
              --output spec-audit.json
          else
            python scripts/audit_all_specs.py \
              --class-name "$AUDIT_CLASS" \
              --parallel-specs 1 \
              --concurrency 5 \
              --output spec-audit.json
          fi

      - name: Upload audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-audit
          path: spec-audit.json
