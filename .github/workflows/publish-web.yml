name: Publish current web snapshot
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Build all PvP datasets and deploy', 'Recover verified snapshot from completed spec artifacts']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/publish-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-publication
  cancel-in-progress: false

jobs:
  publication_route:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.route.outputs.publish }}
      source_sha: ${{ steps.route.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Wait for data validation on mixed source and UI pushes
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_BEFORE: ${{ github.event.before }}
          SOURCE_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            python scripts/publication_policy.py --before "$SOURCE_BEFORE" --after "$SOURCE_AFTER" --github-output "$GITHUB_OUTPUT"
          else
            python scripts/publication_policy.py --github-output "$GITHUB_OUTPUT"
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  package:
    needs: publication_route
    if: needs.publication_route.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publication_route.outputs.source_sha }}
      - name: Record the exact packaged revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Frontend smoke suite
        run: |
          node scripts/numeric_evidence_check.cjs --strict-source-text
          npm run test:smoke
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Record exact publication file hashes
        run: python scripts/check_publication.py --write-inventory
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-inventory
          path: web/publication.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish current web snapshot
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  verify_publication:
    needs: [deploy, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.source_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publication-inventory
          path: .publication
      - name: Verify every live file against the deployed artifact
        run: python scripts/check_publication.py --base-url 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/' --expected-inventory .publication/publication.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the actual deployment in Chromium at desktop and mobile widths
        run: node scripts/live_site_browser_check.cjs
