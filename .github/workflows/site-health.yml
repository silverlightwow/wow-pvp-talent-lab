name: Check live site and publication freshness

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Build all PvP datasets and deploy', 'Publish current web snapshot', 'Recover verified snapshot from completed spec artifacts']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-health
  cancel-in-progress: false

jobs:
  health:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Check frontend files and the 12-hour freshness limit
        run: python scripts/check_publication.py --base-url 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/' --attempts 2 --health-only
