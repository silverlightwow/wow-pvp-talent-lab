name: Check live site and publication freshness

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: read

concurrency:
  group: site-health
  cancel-in-progress: false

jobs:
  health:
    # Post-deployment hashes and freshness run in the publisher itself.
    # This independent schedule still detects later outages or stale sources.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Check frontend files and the 12-hour freshness limit
        run: python scripts/check_publication.py --base-url 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/' --attempts 2 --health-only
