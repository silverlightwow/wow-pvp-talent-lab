name: All classes compatibility audit

on:
  workflow_dispatch:
  schedule:
    # Keep the heavy compatibility audit away from the production
    # all-spec rebuild so we do not self-rate-limit upstream sites.
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: all-classes-audit
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      classes: ${{ steps.matrix.outputs.classes }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: Discover current classes
        id: matrix
        run: python scripts/discover_classes.py --github-output "$GITHUB_OUTPUT"

  audit:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        class_name: ${{ fromJSON(needs.discover.outputs.classes) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Audit all specs for class
        run: |
          python scripts/audit_all_specs.py \
            --class-name "${{ matrix.class_name }}" \
            --parallel-specs 1 \
            --concurrency 5 \
            --output "spec-audit-${{ matrix.class_name }}.json"

      - name: Upload audit report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "spec-audit-${{ matrix.class_name }}"
          path: "spec-audit-${{ matrix.class_name }}.json"
