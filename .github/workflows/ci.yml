name: Python unit tests

on:
  push:
    branches: [main, "fix/**"]
    paths:
      - "pvpcalc/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "pvpcalc/**"
      - "scripts/**"
      - "web/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Validate every shipped specialization
        # Live source/hotfix integration remains mandatory in the pinned 40-spec workflow.
        # Unit CI must not compare several mutable responses collected at different times.
        run: python scripts/validate_site_data.py --data-dir web/data
