name: Python unit tests

on:
  push:
    branches: [main, "fix/**"]
    paths:
      - "pvpcalc/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "pvpcalc/**"
      - "scripts/**"
      - "web/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-unit-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Build Hunter Marksmanship hotfix smoke
        run: |
          python scripts/build_all_site_data.py \
            --class-name Hunter \
            --spec-name Marksmanship \
            --output-dir /tmp/hunter-hotfix-smoke \
            --concurrency 4
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/hunter-hotfix-smoke/hunter-marksmanship.json")
              .read_text(encoding="utf-8")
          )
          abilities = {
              item["talent_name"]: item
              for item in data.get("abilities", [])
          }
          wing_clip = abilities.get("Wing Clip")
          assert wing_clip is not None, "Wing Clip base ability was not resolved"
          assert wing_clip["tooltip_changed"], "Wing Clip PvP tooltip was not changed"
          official = next(
              (
                  item
                  for status in ("applied", "already_current")
                  for item in data["official_hotfixes"].get(status, [])
                  if item.get("spell_id") == wing_clip["spell_id"]
              ),
              None,
          )
          assert official is not None, "Wing Clip has no official source evidence"
          import re
          value = re.search(r"\bby\s+(\d+(?:\.\d+)?)%\s+in PvP combat", official["text"], re.I)
          assert value is not None, official["text"]
          expected = value.group(1) + "%"
          assert expected in wing_clip["pvp_tooltip"], wing_clip["pvp_tooltip"]
          assert any(
              change.get("new_token") == expected
              for change in wing_clip.get("changes", [])
          ), wing_clip.get("changes")
          assert not any(
              item.get("talent_name") == "Wing Clip"
              for item in data["official_hotfixes"]["ignored_non_talent"]
          )
          PY
