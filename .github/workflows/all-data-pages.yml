name: Build all PvP datasets and deploy
on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'pvpcalc/**'
      - 'scripts/**/*.py'
      - 'tests/**'
      - 'package*.json'
      - 'pyproject.toml'
      - '.github/workflows/all-data-pages.yml'
      - 'data-refresh.trigger'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  # UI-only pushes are published by publish-web.yml and no longer restart
  # the expensive 40-spec data refresh. Data/code pushes may supersede an
  # older data run, while the 6-hour schedule remains the freshness source.
  group: all-data-pages
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      specs: ${{ steps.matrix.outputs.specs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Snapshot official Blizzard PvP hotfixes
        run: python scripts/fetch_official_hotfixes.py --output official-hotfixes.json
      - uses: actions/upload-artifact@v4
        with:
          name: official-pvp-hotfixes
          path: official-hotfixes.json
          retention-days: 2
          if-no-files-found: error
      - name: Discover current specializations
        id: matrix
        run: python scripts/discover_specs_matrix.py --github-output "$GITHUB_OUTPUT"
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Frontend regression suite on last verified snapshot
        run: npm test

  build_spec:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        item: ${{ fromJSON(needs.discover.outputs.specs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: official-pvp-hotfixes
          path: .hotfixes
      - name: Build verified specialization
        env:
          CLASS_NAME: ${{ matrix.item.class_name }}
          SPEC_NAME: ${{ matrix.item.spec_name }}
          WOW_PVP_HOTFIX_FILE: .hotfixes/official-hotfixes.json
        run: python scripts/build_all_site_data.py --class-name "$CLASS_NAME" --spec-name "$SPEC_NAME" --output-dir spec-data --concurrency 4
      - run: python scripts/validate_site_data.py --data-dir spec-data
      - uses: actions/upload-artifact@v4
        with:
          name: spec-data-${{ matrix.item.spec_id }}
          path: spec-data
          retention-days: 2
          if-no-files-found: error
  aggregate:
    needs: [discover, build_spec, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: spec-data-*
          path: staged-spec-data
      - name: Assemble the exact discovered catalog
        env:
          EXPECTED_SPECS: ${{ needs.discover.outputs.specs }}
        run: python scripts/merge_class_datasets.py --artifacts-root staged-spec-data --output-dir web/data --expected-specs-json "$EXPECTED_SPECS"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser checks for every specialization and hero tree
        run: npm test
      - name: Commit the verified snapshot without mixing source revisions
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$SOURCE_COMMIT" ]; then
            echo 'Source changed during the build; the newer run must publish instead.'
            exit 1
          fi
          if ! git diff --quiet -- web/data; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add web/data
            git commit -m 'chore: refresh verified PvP datasets [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: aggregate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified snapshot
        id: deployment
        uses: actions/deploy-pages@v4
