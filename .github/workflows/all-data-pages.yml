name: Build all PvP datasets and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/all-data-pages.yml"
      - "scripts/build_all_site_data.py"
      - "pvpcalc/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: all-data-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: Build every current specialization
        run: |
          python scripts/build_all_site_data.py \
            --output-dir web/data \
            --concurrency 6

      - name: Validate generated manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("web/data/manifest.json")
              .read_text(encoding="utf-8")
          )

          count = int(manifest["spec_count"])

          if count < 40:
              raise SystemExit(
                  f"Expected at least 40 current specs, got {count}"
              )

          missing = []
          for cls in manifest["classes"]:
              for spec in cls["specs"]:
                  slug = spec["slug"]
                  for suffix in (".json", ".js"):
                      path = Path("web/data") / f"{slug}{suffix}"
                      if not path.exists():
                          missing.append(str(path))

          if missing:
              raise SystemExit(
                  "Missing generated files: "
                  + ", ".join(missing[:10])
              )

          print(
              f"Validated {count} specialization datasets "
              f"for build {manifest['tree_build']}"
          )
          PY

      - name: Check frontend JavaScript
        run: node --check web/app.js

      - name: Commit verified generated datasets
        run: |
          if git diff --quiet -- web/data; then
            echo "Generated datasets are unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add web/data
          git commit -m "chore: refresh verified PvP datasets [skip ci]"

          # main can advance while the long all-spec rebuild is running.
          # Rebase the generated-data-only commit instead of failing with
          # a non-fast-forward push. concurrency above cancels stale runs
          # whenever a newer relevant main commit starts.
          pushed=false
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main

            if git push; then
              pushed=true
              break
            fi

            echo "Push raced with another main update; retrying ($attempt/5)..."
            sleep 2
          done

          if [ "$pushed" != "true" ]; then
            echo "Could not publish generated datasets after 5 attempts."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload complete site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
