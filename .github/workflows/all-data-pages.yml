name: Build all PvP datasets and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/all-data-pages.yml"
      - "scripts/build_all_site_data.py"
      - "scripts/merge_class_datasets.py"
      - "scripts/discover_specs_matrix.py"
      - "data-refresh.trigger"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: all-data-pages
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      specs: ${{ steps.matrix.outputs.specs }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: Discover current specializations
        id: matrix
        run: python scripts/discover_specs_matrix.py --github-output "$GITHUB_OUTPUT"

  build_spec:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # A fresh runner per specialization avoids one long session hitting
    # Wowhead's request ceiling. A small amount of parallelism keeps the
    # full refresh practical while each runner still uses host pacing.
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        item: ${{ fromJSON(needs.discover.outputs.specs) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Build specialization
        run: |
          python scripts/build_all_site_data.py \
            --class-name "${{ matrix.item.class_name }}" \
            --spec-name "${{ matrix.item.spec_name }}" \
            --output-dir spec-data \
            --concurrency 4

      - name: Validate specialization artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("spec-data/manifest.json")
              .read_text(encoding="utf-8")
          )

          specs = [
              spec
              for cls in manifest["classes"]
              for spec in cls["specs"]
          ]

          if len(specs) != 1:
              raise SystemExit(
                  f"Expected exactly one spec, got {len(specs)}"
              )

          spec = specs[0]
          slug = spec["slug"]

          for suffix in (".json", ".js"):
              path = Path("spec-data") / f"{slug}{suffix}"
              if not path.exists():
                  raise SystemExit(
                      f"Missing specialization dataset: {path}"
                  )

          print(
              f"{slug}: {spec['verification_status']} · "
              f"fetch={spec['fetch_error_count']} · "
              f"unresolved={spec['unresolved_count']} · "
              f"review={spec['review_required_count']}"
          )
          PY

      - name: Upload specialization dataset
        uses: actions/upload-artifact@v4
        with:
          name: "spec-data-${{ matrix.item.spec_id }}"
          path: spec-data
          retention-days: 1
          if-no-files-found: error

  aggregate:
    needs:
      - discover
      - build_spec
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all specialization artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "spec-data-*"
          path: staged-spec-data
          merge-multiple: false

      - name: Merge production dataset snapshot
        run: |
          python scripts/merge_class_datasets.py \
            --artifacts-root staged-spec-data \
            --output-dir web/data

      - name: Validate generated manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("web/data/manifest.json")
              .read_text(encoding="utf-8")
          )

          count = int(manifest["spec_count"])

          if count < 40:
              raise SystemExit(
                  f"Expected at least 40 current specs, got {count}"
              )

          missing = []
          for cls in manifest["classes"]:
              for spec in cls["specs"]:
                  slug = spec["slug"]
                  for suffix in (".json", ".js"):
                      path = Path("web/data") / f"{slug}{suffix}"
                      if not path.exists():
                          missing.append(str(path))

          if missing:
              raise SystemExit(
                  "Missing generated files: "
                  + ", ".join(missing[:10])
              )

          print(
              f"Validated {count} specialization datasets "
              f"for build {manifest['tree_build']}; "
              f"{manifest['verified_count']} verified, "
              f"{manifest['partial_count']} partial"
          )
          PY

      - name: Check frontend JavaScript
        run: node --check web/app.js

      - name: Commit generated datasets
        run: |
          if git diff --quiet -- web/data; then
            echo "Generated datasets are unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add web/data
            git commit -m "chore: refresh all PvP datasets [skip ci]"

            pushed=false
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main

              if git push; then
                pushed=true
                break
              fi

              echo "Push raced with another main update; retrying ($attempt/5)..."
              sleep 2
            done

            if [ "$pushed" != "true" ]; then
              echo "Could not publish generated datasets after 5 attempts."
              exit 1
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload complete site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: aggregate

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
