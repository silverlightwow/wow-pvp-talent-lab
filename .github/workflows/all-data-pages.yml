name: Build all PvP datasets and deploy
on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'
  pull_request:
    paths:
      - 'pvpcalc/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/all-data-pages.yml'
  push:
    branches: [main]
    paths:
      - 'pvpcalc/**'
      - 'scripts/**/*.py'
      - 'scripts/**/*.cjs'
      - 'tests/**'
      - 'package*.json'
      - 'pyproject.toml'
      - '.github/workflows/all-data-pages.yml'
      - 'data-refresh.trigger'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  # UI-only pushes are published by publish-web.yml and no longer restart
  # the expensive 40-spec data refresh. Data/code pushes may supersede an
  # older data run, while the 6-hour schedule remains the freshness source.
  group: all-data-pages-${{ github.event.pull_request.number || 'main' }}
  # A scheduled freshness check must wait for the running browser matrix.
  # Source pushes still supersede obsolete runs.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      specs: ${{ steps.matrix.outputs.specs }}
      simc_ref: ${{ steps.sources.outputs.simc_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - name: Snapshot official Blizzard PvP hotfixes
        run: python scripts/fetch_official_hotfixes.py --output official-hotfixes.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-pvp-hotfixes
          path: official-hotfixes.json
          retention-days: 14
          if-no-files-found: error
      - name: Discover current specializations
        id: matrix
        run: python scripts/discover_specs_matrix.py --github-output "$GITHUB_OUTPUT" --snapshot-output raidbots-snapshot.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raidbots-snapshot
          path: raidbots-snapshot.json
          retention-days: 14
          if-no-files-found: error
      - name: Plan one fresh snapshot of all external inputs
        id: sources
        run: python scripts/collect_source_snapshot.py --phase plan --raidbots raidbots-snapshot.json --hotfixes official-hotfixes.json --output source-plan --github-output "$GITHUB_OUTPUT"
      - name: Preserve common source inputs, including failed plans
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-plan
          path: source-plan
          retention-days: 14
          if-no-files-found: warn

  capture_sources:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        partition: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-plan
          path: .source-plan
      - name: Capture disjoint spell inputs
        run: python scripts/collect_source_snapshot.py --phase capture --input-plan .source-plan --partition-index ${{ matrix.partition }} --partitions 4 --output source-part
      - name: Preserve source responses and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-part-${{ matrix.partition }}
          path: source-part
          retention-days: 14
          if-no-files-found: warn
  merge_sources:
    needs: [discover, capture_sources]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-plan
          path: .source-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: source-part-*
          path: source-parts
      - name: Assemble and verify one common source snapshot
        run: python scripts/collect_source_snapshot.py --phase merge --input-plan .source-plan --parts-dir source-parts --partitions 4 --output source-snapshot
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-snapshot
          path: source-snapshot
          retention-days: 14
          if-no-files-found: error
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Frontend smoke suite on last verified snapshot
        run: npm run test:smoke

  build_spec:
    needs: [discover, merge_sources]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        item: ${{ fromJSON(needs.discover.outputs.specs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: official-pvp-hotfixes
          path: .hotfixes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raidbots-snapshot
          path: .raidbots
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-snapshot
          path: .sources
      - name: Build verified specialization
        env:
          CLASS_NAME: ${{ matrix.item.class_name }}
          SPEC_NAME: ${{ matrix.item.spec_name }}
          WOW_PVP_HOTFIX_FILE: .hotfixes/official-hotfixes.json
          WOW_PVP_RAIDBOTS_FILE: .raidbots/raidbots-snapshot.json
          WOW_PVP_SOURCE_SNAPSHOT: .sources
          WOW_PVP_SIMC_REF: ${{ needs.discover.outputs.simc_ref }}
        run: |
          set -o pipefail
          python scripts/build_all_site_data.py --class-name "$CLASS_NAME" --spec-name "$SPEC_NAME" --output-dir spec-data --concurrency 4 --verify-replay 2>&1 | tee build.log
      - name: Preserve specialization diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-audit-${{ matrix.item.spec_id }}
          path: build.log
          retention-days: 14
      - run: python scripts/validate_site_data.py --data-dir spec-data
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-data-${{ matrix.item.spec_id }}
          path: spec-data
          retention-days: 14
          if-no-files-found: error
  aggregate:
    needs: [discover, build_spec, frontend]
    runs-on: ubuntu-latest
    # The exhaustive browser matrix can exceed 50 minutes on a busy runner.
    # Leave room for verification before committing and deploying the snapshot.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: spec-data-*
          path: staged-spec-data
      - name: Install dataset validation dependencies
        run: python -m pip install -e .
      - name: Assemble the exact discovered catalog
        env:
          EXPECTED_SPECS: ${{ needs.discover.outputs.specs }}
        run: python scripts/merge_class_datasets.py --artifacts-root staged-spec-data --output-dir web/data --expected-specs-json "$EXPECTED_SPECS"
      - name: Report source health
        run: python scripts/report_source_health.py web/data
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser checks for every specialization and hero tree
        env:
          REQUIRE_CURRENT_HOTFIX_ABILITIES: '1'
        run: npm test
      - name: Commit the verified snapshot without mixing source revisions
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"

          if [ "$CURRENT_MAIN" != "$SOURCE_COMMIT" ]; then
            DATA_SOURCE_CHANGES="$(
              git diff --name-only "$SOURCE_COMMIT" "$CURRENT_MAIN" -- \
                pvpcalc \
                scripts \
                tests \
                pyproject.toml \
                package.json \
                package-lock.json \
                data-refresh.trigger \
                .github/workflows/all-data-pages.yml
            )"

            if [ -n "$DATA_SOURCE_CHANGES" ]; then
              echo 'Data-producing source changed during the build; the newer run must publish instead.'
              printf '%s\n' "$DATA_SOURCE_CHANGES"
              exit 1
            fi

            echo 'Only non-data files changed during the build; rebasing the verified snapshot onto current main.'

            SNAPSHOT_DIR="$(mktemp -d)"
            cp -a web/data/. "$SNAPSHOT_DIR/"

            git reset --hard "$CURRENT_MAIN"

            rm -rf web/data
            mkdir -p web/data
            cp -a "$SNAPSHOT_DIR/." web/data/
            rm -rf "$SNAPSHOT_DIR"
          fi

          if ! git diff --quiet -- web/data; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add web/data
            git commit -m 'chore: refresh verified PvP datasets [skip ci]'
            git push origin HEAD:main
          fi
      - name: Record exact publication file hashes
        run: python scripts/check_publication.py --write-inventory
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-inventory
          path: web/publication.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: aggregate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified snapshot
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  verify_publication:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publication-inventory
          path: .publication
      - name: Verify every live file against the deployed artifact
        run: python scripts/check_publication.py --base-url 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/' --expected-inventory .publication/publication.json
