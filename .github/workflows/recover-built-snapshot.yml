name: Recover verified snapshot from completed spec artifacts

on:
  push:
    branches: [main]
    paths: ['.github/snapshot-recovery.json']
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run containing all verified spec-data-* artifacts'
        required: true
        type: string
      source_sha:
        description: 'Current main commit SHA to validate and publish'
        required: true
        type: string
      artifact_source_sha:
        description: 'Source commit SHA of the artifact build run'
        required: true
        type: string

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: recover-built-snapshot
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Resolve the explicit recovery request
        id: request
        env:
          REQUEST_RUN_ID: ${{ inputs.run_id }}
          REQUEST_ARTIFACT_SHA: ${{ inputs.artifact_source_sha }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          request = (dict(run_id=os.environ['REQUEST_RUN_ID'], artifact_source_sha=os.environ['REQUEST_ARTIFACT_SHA'])
                     if os.environ['REQUEST_RUN_ID'] else json.loads(Path('.github/snapshot-recovery.json').read_text()))
          run_id, sha = str(request['run_id']), str(request['artifact_source_sha'])
          assert re.fullmatch(r'[1-9][0-9]*', run_id), 'Invalid source run ID'
          assert re.fullmatch(r'[0-9a-f]{40}', sha), 'Invalid artifact source SHA'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'run_id={run_id}\nartifact_source_sha={sha}\n')
          PY
      - name: Verify artifact provenance and data-producing sources
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ steps.request.outputs.run_id }}
          ARTIFACT_SOURCE_COMMIT: ${{ steps.request.outputs.artifact_source_sha }}
          SOURCE_COMMIT: ${{ inputs.source_sha || github.sha }}
        run: |
          RUN_SOURCE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}" --jq '.head_sha')"
          if [ "$RUN_SOURCE_SHA" != "$ARTIFACT_SOURCE_COMMIT" ]; then
            echo 'Artifact run source does not match the supplied SHA.'
            exit 1
          fi
          if ! git diff --quiet "$ARTIFACT_SOURCE_COMMIT" "$SOURCE_COMMIT" -- \
            pvpcalc ':(glob)scripts/**/*.py' pyproject.toml; then
            echo 'Data-producing sources changed since the artifact build; a fresh build is required.'
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e '.[dev]'
      - name: Download verified spec artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: spec-data-*
          path: staged-spec-data
          run-id: ${{ steps.request.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download the source run's exact discovered catalog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raidbots-snapshot
          path: .recovery-inputs
          run-id: ${{ steps.request.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Discover expected specs and reject stale source snapshots
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from pvpcalc.sources import raidbots
          snapshot = json.loads(Path('.recovery-inputs/raidbots-snapshot.json').read_text())
          rows = raidbots.discover_specs(snapshot['talents'])
          assert rows, 'Source catalog is incomplete'
          Path('expected-specs.json').write_text(json.dumps(rows))
          now = datetime.now(timezone.utc)
          for path in Path('staged-spec-data').rglob('*.json'):
              data = json.loads(path.read_text())
              if 'talents' not in data:
                  continue
              captured = (data.get('source_snapshot') or {}).get('captured_at') or data['generated_at']
              age = (now - datetime.fromisoformat(captured.replace('Z', '+00:00'))).total_seconds()
              assert -300 <= age <= 6 * 3600, f'Stale or future source snapshot: {path}'
          PY
      - name: Assemble one consistent source snapshot
        run: python scripts/merge_class_datasets.py --artifacts-root staged-spec-data --output-dir web/data --expected-specs-json "$(cat expected-specs.json)"
      - run: python scripts/validate_site_data.py --data-dir web/data
      - name: Report retained source warnings
        run: python scripts/report_source_health.py web/data
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full browser and data regression suite
        env:
          REQUIRE_CURRENT_HOTFIX_ABILITIES: '1'
        run: npm test
      - name: Commit the untouched, verified dataset
        env:
          SOURCE_COMMIT: ${{ inputs.source_sha || github.sha }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$SOURCE_COMMIT" ]; then
            echo 'Source changed during recovery; refusing to mix revisions.'
            exit 1
          fi
          if ! git diff --quiet -- web/data; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add web/data
            git commit -m 'chore: publish recovered verified PvP datasets [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Record exact publication file hashes
        run: python scripts/check_publication.py --write-inventory
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-inventory
          path: web/publication.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

  deploy:
    needs: recover
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish recovered verified snapshot
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  verify_publication:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publication-inventory
          path: .publication
      - name: Verify every live file against the deployed artifact
        run: python scripts/check_publication.py --base-url 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/' --expected-inventory .publication/publication.json
