name: Import project source

on:
  push:
    branches: [main]
    paths:
      - source_only.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and expand verified project snapshot
        run: |
          unzip -t source_only.zip
          unzip -o source_only.zip
          rm -f source_only.zip
          rm -f .github/workflows/bootstrap.yml

      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import WoW PvP Talent Lab v2.1"
          git push
