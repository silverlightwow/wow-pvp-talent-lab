name: Test deployed site in a real browser

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/live_site_browser_check.cjs'
      - '.github/workflows/live-site-browser.yml'
  workflow_dispatch:
  schedule:
    - cron: '43 1,7,13,19 * * *'
  workflow_run:
    workflows: ['Build all PvP datasets and deploy']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live_browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Open live GitHub Pages and navigate the calculator
        run: node scripts/live_site_browser_check.cjs
