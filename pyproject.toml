[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wow-pvp-talent-lab"
version = "0.1.0"
description = "PvP-aware WoW talent data reconciler and web talent calculator"
requires-python = ">=3.11"

dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.2",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pandas>=2.2",
]

[project.scripts]
pvpcalc = "pvpcalc.cli:main"

[tool.setuptools.packages.find]
include = ["pvpcalc*"]
exclude = ["web*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
